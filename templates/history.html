<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scan History</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #25a517ff; color: white; }
    tr:nth-child(even) { background: #f2f2f2; }
    .btn { padding: 8px 16px; background: #0077ff; color: white; text-decoration: none; border-radius: 6px; }
    .btn:hover { background: #005edc; }
    .delete-btn { padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .delete-btn:hover { background: #a71d2a; }
  </style>
</head>
<body>
  <h2>📜 Arecanut Scanning History</h2>
  <a href="{{ url_for('index') }}" class="btn">⬅ Back to Dashboard</a>

  <table>
    <tr>
      <th>ID</th>
      <th>Filename</th>
      <th>Grade A</th>
      <th>Grade B</th>
      <th>Final Grade</th>
      <th>Timestamp</th>
      <th>Action</th>
    </tr>
    {% for scan in scans %}
    <tr>
      <td>{{ scan[0] }}</td>
      <td>{{ scan[1] }}</td>
      <td>{{ scan[2] }}</td>
      <td>{{ scan[3] }}</td>
      <td>{{ scan[4] }}</td>
      <td>{{ scan[5] }}</td>
      <td>
        <form action="{{ url_for('delete_scan', scan_id=scan[0]) }}" method="post" style="display:inline;">
          <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete this record?');">Delete</button>
        </form>
      </td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
